<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="/manifest.json">
<title>CLUTCH — turn it on now</title>
<style>
  :root{--bg:#0b0d10;--card:#14171c;--card2:#1a1e25;--line:#262c35;--text:#f0f3f6;--dim:#8b95a3;--dimmer:#565f6c;--live:#27e08a;--hot1:#ffd24a;--hot2:#ff7a2f;--hot3:#ff3a3a;--where:#5aa9ff;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);max-width:680px;margin:0 auto;padding:0 14px 90px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
  .mono{font-family:'SF Mono',ui-monospace,'Roboto Mono',Menlo,Consolas,monospace}
  header{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--bg) 82%,transparent);padding:max(18px,env(safe-area-inset-top)) 0 12px}
  .top{display:flex;align-items:center;gap:11px}
  .logo{font-weight:900;font-size:25px;letter-spacing:-1px;background:linear-gradient(92deg,var(--hot1),var(--hot3));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:11px;color:var(--dim);letter-spacing:.5px;font-weight:600}
  .bell{margin-left:auto;background:var(--card);border:1px solid var(--line);color:var(--dim);height:36px;padding:0 13px;border-radius:9px;cursor:pointer;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
  .bell.on{background:rgba(39,224,138,.12);border-color:rgba(39,224,138,.4);color:var(--live)}
  .statusbar{display:flex;align-items:center;gap:7px;margin-top:11px;font-size:11px;color:var(--dimmer)}
  .scan{width:7px;height:7px;border-radius:50%;background:var(--live);animation:blink 1.6s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  .verdict{background:linear-gradient(120deg,#15191f,#12161c);border:1px solid var(--line);border-radius:15px;padding:16px;margin:6px 0 4px;display:flex;gap:13px;align-items:center}
  .verdict .big{font-size:30px}.verdict h2{font-size:15px;font-weight:800;margin-bottom:3px}.verdict p{font-size:12px;color:var(--dim);line-height:1.45}
  .sectlabel{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dimmer);font-weight:700;margin:22px 2px 11px;display:flex;align-items:center;gap:8px}
  .sectlabel .ct{margin-left:auto;color:var(--dim)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:15px;margin-bottom:11px;overflow:hidden;position:relative}
  .card.hot{border-color:rgba(255,90,30,.5)}
  .heatbar{position:absolute;left:0;top:0;bottom:0;width:4px}
  .chead{display:flex;align-items:center;padding:13px 15px 9px;gap:10px}
  .lgtag{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--dim);background:var(--card2);border:1px solid var(--line);padding:3px 8px;border-radius:6px}
  .situation{font-size:12.5px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .situation.livec{color:var(--hot1)}
  .clutchpill{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:4px 9px;border-radius:20px;white-space:nowrap}
  .matchup{padding:2px 15px 13px}
  .trow{display:flex;align-items:center;gap:11px;padding:5px 0}
  .tabbr{font-weight:800;font-size:17px;width:46px;flex:0 0 46px;letter-spacing:.4px}
  .tname{color:var(--dim);font-size:12.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tscore{font-weight:800;font-size:21px;font-variant-numeric:tabular-nums}
  .trow.trail .tabbr,.trow.trail .tname,.trow.trail .tscore{color:var(--dim)}
  .where{display:flex;align-items:center;gap:9px;padding:11px 15px;background:var(--card2);border-top:1px solid var(--line);font-size:12.5px}
  .where .eye{color:var(--where);font-weight:800;font-size:11px;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
  .nets{display:flex;gap:6px;flex-wrap:wrap;flex:1}
  .net{background:rgba(90,169,255,.12);border:1px solid rgba(90,169,255,.3);color:#bcd9ff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px}
  .when{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--dim);white-space:nowrap}
  .quiet{padding:14px;color:var(--dimmer);font-size:12px;text-align:center;border:1px dashed var(--line);border-radius:13px;margin-bottom:11px}
  footer{text-align:center;padding:30px 0 0;color:var(--dimmer);font-size:10.5px;line-height:1.9}
  footer b{color:var(--dim)}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo">CLUTCH</div>
    <div class="sub">turn it on now</div>
    <button class="bell" id="bell">🔔 Alerts off</button>
  </div>
  <div class="statusbar">
    <span class="scan"></span>
    <span id="status">connecting…</span>
    <span class="mono" id="updated" style="margin-left:auto"></span>
  </div>
</header>

<main>
  <div class="verdict" id="verdict"></div>
  <div class="sectlabel">🔥 Must-watch now <span class="ct" id="hotct"></span></div>
  <div id="hot"></div>
  <div class="sectlabel">Live now <span class="ct" id="livect"></span></div>
  <div id="livenow"></div>
  <div class="sectlabel">Starting soon <span class="ct" id="deckct"></span></div>
  <div id="ondeck"></div>
</main>

<footer>
  <b>CLUTCH</b> — it watches every live game so you don't have to<br>
  scores update live · turn on alerts to get pinged when a game gets good
</footer>

<script src="/app.js"></script>
</body>
</html>
